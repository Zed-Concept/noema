name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: typecheck, lint, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      # npm ci, not npm install: it installs exactly the committed lockfile and
      # fails if package.json and the lockfile have drifted apart.
      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test -- --ci

      # eslint-config-prettier switches ESLint's formatting rules off, so the
      # lint step above does not check formatting. This is the step that does.
      - name: Format check
        run: npm run format:check
